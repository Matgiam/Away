<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" role="img" aria-label="D minor chord — press D, F, A together">
  <rect width="700" height="220" fill="#0a0118" />
  <g transform="translate(20 30)">
    <rect x="0"   y="0" width="90" height="170" fill="#f5efe2" stroke="#1a1108" stroke-width="2" />
    <rect x="90"  y="0" width="90" height="170" fill="#5571a8" stroke="#1a1108" stroke-width="2" />
    <rect x="180" y="0" width="90" height="170" fill="#f5efe2" stroke="#1a1108" stroke-width="2" />
    <rect x="270" y="0" width="90" height="170" fill="#5571a8" stroke="#1a1108" stroke-width="2" />
    <rect x="360" y="0" width="90" height="170" fill="#f5efe2" stroke="#1a1108" stroke-width="2" />
    <rect x="450" y="0" width="90" height="170" fill="#5571a8" stroke="#1a1108" stroke-width="2" />
    <rect x="540" y="0" width="90" height="170" fill="#f5efe2" stroke="#1a1108" stroke-width="2" />
    <g fill="#161616">
      <rect x="60"  y="0" width="60" height="105" />
      <rect x="150" y="0" width="60" height="105" />
      <rect x="330" y="0" width="60" height="105" />
      <rect x="420" y="0" width="60" height="105" />
      <rect x="510" y="0" width="60" height="105" />
    </g>
    <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">
      <text x="135" y="150">D</text>
      <text x="315" y="150">F</text>
      <text x="495" y="150">A</text>
    </g>
    <text x="315" y="-8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#9aaadb" text-anchor="middle">D minor — D · F · A</text>
  </g>
</svg>
