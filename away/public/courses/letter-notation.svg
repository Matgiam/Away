<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" role="img" aria-label="One octave of piano keys labelled C D E F G A B">
  <rect width="700" height="200" fill="#0a0118" />
  <!-- 7 white keys -->
  <g>
    <rect x="20" y="20" width="90" height="160" fill="#f5efe2" stroke="#1a1108" stroke-width="2" />
    <rect x="110" y="20" width="90" height="160" fill="#f5efe2" stroke="#1a1108" stroke-width="2" />
    <rect x="200" y="20" width="90" height="160" fill="#f5efe2" stroke="#1a1108" stroke-width="2" />
    <rect x="290" y="20" width="90" height="160" fill="#f5efe2" stroke="#1a1108" stroke-width="2" />
    <rect x="380" y="20" width="90" height="160" fill="#f5efe2" stroke="#1a1108" stroke-width="2" />
    <rect x="470" y="20" width="90" height="160" fill="#f5efe2" stroke="#1a1108" stroke-width="2" />
    <rect x="560" y="20" width="90" height="160" fill="#f5efe2" stroke="#1a1108" stroke-width="2" />
  </g>
  <!-- 5 black keys (between C-D, D-E, F-G, G-A, A-B) -->
  <g>
    <rect x="80" y="20" width="55" height="100" fill="#161616" />
    <rect x="170" y="20" width="55" height="100" fill="#161616" />
    <!-- no black between E-F -->
    <rect x="350" y="20" width="55" height="100" fill="#161616" />
    <rect x="440" y="20" width="55" height="100" fill="#161616" />
    <rect x="530" y="20" width="55" height="100" fill="#161616" />
  </g>
  <!-- White-key letter labels -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700" fill="#1a1108" text-anchor="middle">
    <text x="65" y="160">C</text>
    <text x="155" y="160">D</text>
    <text x="245" y="160">E</text>
    <text x="335" y="160">F</text>
    <text x="425" y="160">G</text>
    <text x="515" y="160">A</text>
    <text x="605" y="160">B</text>
  </g>
</svg>
