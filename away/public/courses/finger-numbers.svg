<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" role="img" aria-label="Both hands with fingers labelled 1 to 5: thumbs are 1, pinkies are 5">
  <rect width="700" height="260" fill="#0a0118" />
  <!-- LEFT HAND (palm down, pinky on the left) -->
  <g transform="translate(50 30)">
    <!-- Palm -->
    <rect x="20" y="120" width="220" height="100" rx="36" fill="#f1c39a" stroke="#3f2812" stroke-width="2" />
    <!-- Fingers (left to right: 5 pinky, 4, 3, 2, 1 thumb) -->
    <!-- pinky (5) -->
    <rect x="22"  y="60" width="32" height="80" rx="14" fill="#f1c39a" stroke="#3f2812" stroke-width="2" />
    <!-- ring (4) -->
    <rect x="60"  y="40" width="34" height="100" rx="14" fill="#f1c39a" stroke="#3f2812" stroke-width="2" />
    <!-- middle (3) -->
    <rect x="100" y="30" width="34" height="110" rx="14" fill="#f1c39a" stroke="#3f2812" stroke-width="2" />
    <!-- index (2) -->
    <rect x="140" y="40" width="34" height="100" rx="14" fill="#f1c39a" stroke="#3f2812" stroke-width="2" />
    <!-- thumb (1) sticking out to the right -->
    <rect x="184" y="100" width="60" height="34" rx="16" fill="#f1c39a" stroke="#3f2812" stroke-width="2" transform="rotate(-15 214 117)" />
    <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">
      <circle cx="38"  cy="95" r="14" fill="#7a2db0" />
      <text x="38" y="102">5</text>
      <circle cx="77"  cy="75" r="14" fill="#7a2db0" />
      <text x="77" y="82">4</text>
      <circle cx="117" cy="65" r="14" fill="#7a2db0" />
      <text x="117" y="72">3</text>
      <circle cx="157" cy="75" r="14" fill="#7a2db0" />
      <text x="157" y="82">2</text>
      <circle cx="230" cy="100" r="14" fill="#c75ad6" />
      <text x="230" y="107">1</text>
    </g>
    <text x="130" y="245" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#c75ad6" text-anchor="middle">Left hand</text>
  </g>

  <!-- RIGHT HAND (mirror) -->
  <g transform="translate(700 30) scale(-1 1)">
    <rect x="50" y="120" width="220" height="100" rx="36" fill="#f1c39a" stroke="#3f2812" stroke-width="2" />
    <rect x="52" y="60"  width="32" height="80"  rx="14" fill="#f1c39a" stroke="#3f2812" stroke-width="2" />
    <rect x="90" y="40"  width="34" height="100" rx="14" fill="#f1c39a" stroke="#3f2812" stroke-width="2" />
    <rect x="130" y="30" width="34" height="110" rx="14" fill="#f1c39a" stroke="#3f2812" stroke-width="2" />
    <rect x="170" y="40" width="34" height="100" rx="14" fill="#f1c39a" stroke="#3f2812" stroke-width="2" />
    <rect x="214" y="100" width="60" height="34" rx="16" fill="#f1c39a" stroke="#3f2812" stroke-width="2" transform="rotate(-15 244 117)" />
  </g>
  <!-- Right-hand finger labels (drawn unflipped) -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">
    <circle cx="612" cy="125" r="14" fill="#7a2db0" />
    <text x="612" y="132">5</text>
    <circle cx="573" cy="105" r="14" fill="#7a2db0" />
    <text x="573" y="112">4</text>
    <circle cx="533" cy="95"  r="14" fill="#7a2db0" />
    <text x="533" y="102">3</text>
    <circle cx="493" cy="105" r="14" fill="#7a2db0" />
    <text x="493" y="112">2</text>
    <circle cx="420" cy="130" r="14" fill="#c75ad6" />
    <text x="420" y="137">1</text>
  </g>
  <text x="525" y="275" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#c75ad6" text-anchor="middle">Right hand</text>
</svg>
