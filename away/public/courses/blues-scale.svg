<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-label="C blues scale — C E flat F G flat G B flat C">
  <rect width="760" height="220" fill="#0a0118" />
  <g transform="translate(20 30)">
    <rect x="0"   y="0" width="90" height="170" fill="#c75ad6" stroke="#1a1108" stroke-width="2" />
    <rect x="90"  y="0" width="90" height="170" fill="#f5efe2" stroke="#1a1108" stroke-width="2" />
    <rect x="180" y="0" width="90" height="170" fill="#f5efe2" stroke="#1a1108" stroke-width="2" />
    <rect x="270" y="0" width="90" height="170" fill="#c75ad6" stroke="#1a1108" stroke-width="2" />
    <rect x="360" y="0" width="90" height="170" fill="#c75ad6" stroke="#1a1108" stroke-width="2" />
    <rect x="450" y="0" width="90" height="170" fill="#f5efe2" stroke="#1a1108" stroke-width="2" />
    <rect x="540" y="0" width="90" height="170" fill="#f5efe2" stroke="#1a1108" stroke-width="2" />
    <rect x="630" y="0" width="90" height="170" fill="#c75ad6" stroke="#1a1108" stroke-width="2" />
    <g fill="#161616">
      <rect x="60"  y="0" width="60" height="105" />
      <!-- E♭ highlighted -->
      <rect x="150" y="0" width="60" height="105" fill="#c75ad6" />
      <!-- G♭ highlighted (the BLUE NOTE) -->
      <rect x="330" y="0" width="60" height="105" fill="#ff8d96" />
      <rect x="420" y="0" width="60" height="105" />
      <!-- B♭ highlighted -->
      <rect x="510" y="0" width="60" height="105" fill="#c75ad6" />
    </g>
    <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">
      <text x="45"  y="150">C</text>
      <text x="180" y="60">E♭</text>
      <text x="315" y="150">F</text>
      <text x="360" y="60">G♭</text>
      <text x="405" y="150">G</text>
      <text x="540" y="60">B♭</text>
      <text x="675" y="150">C</text>
    </g>
    <text x="360" y="-6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#c75ad6" text-anchor="middle">C blues — the pink G♭ is the "blue note"</text>
  </g>
</svg>
