<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-label="G major scale — one black key, F sharp, replaces F">
  <rect width="760" height="220" fill="#0a0118" />
  <g transform="translate(20 30)">
    <!-- G A B C D E F♯ G (8 white-key positions but F♯ replaces F) -->
    <rect x="0"   y="0" width="90" height="170" fill="#c75ad6" stroke="#1a1108" stroke-width="2" />
    <rect x="90"  y="0" width="90" height="170" fill="#c75ad6" stroke="#1a1108" stroke-width="2" />
    <rect x="180" y="0" width="90" height="170" fill="#c75ad6" stroke="#1a1108" stroke-width="2" />
    <rect x="270" y="0" width="90" height="170" fill="#c75ad6" stroke="#1a1108" stroke-width="2" />
    <rect x="360" y="0" width="90" height="170" fill="#c75ad6" stroke="#1a1108" stroke-width="2" />
    <rect x="450" y="0" width="90" height="170" fill="#c75ad6" stroke="#1a1108" stroke-width="2" />
    <rect x="540" y="0" width="90" height="170" fill="#f5efe2" stroke="#1a1108" stroke-width="2" />
    <rect x="630" y="0" width="90" height="170" fill="#c75ad6" stroke="#1a1108" stroke-width="2" />
    <g fill="#161616">
      <rect x="60"  y="0" width="60" height="105" />
      <rect x="240" y="0" width="60" height="105" />
      <rect x="330" y="0" width="60" height="105" />
      <rect x="420" y="0" width="60" height="105" />
      <!-- F♯ highlighted -->
      <rect x="510" y="0" width="60" height="105" fill="#c75ad6" />
    </g>
    <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">
      <text x="45"  y="150">G</text>
      <text x="135" y="150">A</text>
      <text x="225" y="150">B</text>
      <text x="315" y="150">C</text>
      <text x="405" y="150">D</text>
      <text x="495" y="150">E</text>
      <text x="540" y="60">F♯</text>
      <text x="675" y="150">G</text>
    </g>
    <text x="380" y="-6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#c75ad6" text-anchor="middle">G A B C D E F♯ G — one black key</text>
  </g>
</svg>
