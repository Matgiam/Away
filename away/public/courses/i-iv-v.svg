<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-label="I, IV, V chords in C major: C, F, G — the three chord backbone">
  <rect width="760" height="220" fill="#0a0118" />
  <text x="380" y="30" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#c75ad6" text-anchor="middle">The 3 chord backbone in C major</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="44" font-weight="800" fill="#fff" text-anchor="middle">
    <g>
      <circle cx="160" cy="120" r="60" fill="#7a2db0" stroke="#fff" stroke-width="2" />
      <text x="160" y="135">C</text>
      <text x="160" y="200" font-size="18" font-weight="700" fill="#c75ad6">I — home</text>
    </g>
    <g>
      <circle cx="380" cy="120" r="60" fill="#3a5a8a" stroke="#fff" stroke-width="2" />
      <text x="380" y="135">F</text>
      <text x="380" y="200" font-size="18" font-weight="700" fill="#9aaadb">IV — lift</text>
    </g>
    <g>
      <circle cx="600" cy="120" r="60" fill="#a04a82" stroke="#fff" stroke-width="2" />
      <text x="600" y="135">G</text>
      <text x="600" y="200" font-size="18" font-weight="700" fill="#f0abfc">V — tension</text>
    </g>
  </g>
  <g stroke="#fff" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 230 120 L 310 120" />
    <path d="M 305 114 L 310 120 L 305 126" />
    <path d="M 450 120 L 530 120" />
    <path d="M 525 114 L 530 120 L 525 126" />
  </g>
</svg>
