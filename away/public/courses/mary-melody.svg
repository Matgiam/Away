<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" role="img" aria-label="Mary had a little lamb — uses three white keys C, D, E. Press order: E D C D E E E">
  <rect width="780" height="260" fill="#0a0118" />
  <text x="390" y="28" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#c75ad6" text-anchor="middle">Mary had a little lamb — only 3 keys: C, D, E</text>

  <!-- Keyboard showing the 5 C-position keys, only C/D/E lit -->
  <g transform="translate(140 50)">
    <rect x="0"   y="0" width="100" height="140" fill="#c75ad6" stroke="#1a1108" stroke-width="2" />
    <rect x="100" y="0" width="100" height="140" fill="#c75ad6" stroke="#1a1108" stroke-width="2" />
    <rect x="200" y="0" width="100" height="140" fill="#c75ad6" stroke="#1a1108" stroke-width="2" />
    <rect x="300" y="0" width="100" height="140" fill="#f5efe2" stroke="#1a1108" stroke-width="2" />
    <rect x="400" y="0" width="100" height="140" fill="#f5efe2" stroke="#1a1108" stroke-width="2" />
    <g fill="#161616">
      <rect x="70"  y="0" width="60" height="85" />
      <rect x="170" y="0" width="60" height="85" />
      <rect x="370" y="0" width="60" height="85" />
    </g>
    <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800" text-anchor="middle">
      <text x="50"  y="120" fill="#fff">C</text>
      <text x="150" y="120" fill="#fff">D</text>
      <text x="250" y="120" fill="#fff">E</text>
      <text x="350" y="120" fill="#1a1108">F</text>
      <text x="450" y="120" fill="#1a1108">G</text>
    </g>
    <!-- Cross-out marks on F and G to say "don't use these" -->
    <g stroke="#ff8d96" stroke-width="3.5" stroke-linecap="round" opacity="0.85">
      <line x1="318" y1="20" x2="382" y2="60" />
      <line x1="382" y1="20" x2="318" y2="60" />
      <line x1="418" y1="20" x2="482" y2="60" />
      <line x1="482" y1="20" x2="418" y2="60" />
    </g>
  </g>

  <!-- Press order strip -->
  <g transform="translate(140 210)" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="800" text-anchor="middle">
    <text x="-20" y="20" font-size="12" font-style="italic" font-weight="400" fill="#9aaadb" text-anchor="start">Press in order:</text>
    <g>
      <circle cx="100" cy="15" r="16" fill="#c75ad6" />
      <text x="100" y="21" font-size="14" fill="#fff">E</text>
      <circle cx="150" cy="15" r="16" fill="#c75ad6" />
      <text x="150" y="21" font-size="14" fill="#fff">D</text>
      <circle cx="200" cy="15" r="16" fill="#c75ad6" />
      <text x="200" y="21" font-size="14" fill="#fff">C</text>
      <circle cx="250" cy="15" r="16" fill="#c75ad6" />
      <text x="250" y="21" font-size="14" fill="#fff">D</text>
      <circle cx="300" cy="15" r="16" fill="#c75ad6" />
      <text x="300" y="21" font-size="14" fill="#fff">E</text>
      <circle cx="350" cy="15" r="16" fill="#c75ad6" />
      <text x="350" y="21" font-size="14" fill="#fff">E</text>
      <circle cx="400" cy="15" r="16" fill="#c75ad6" />
      <text x="400" y="21" font-size="14" fill="#fff">E</text>
    </g>
    <!-- arrows between each note -->
    <g stroke="#c75ad6" stroke-width="2" fill="none" opacity="0.5">
      <line x1="118" y1="15" x2="132" y2="15" />
      <line x1="168" y1="15" x2="182" y2="15" />
      <line x1="218" y1="15" x2="232" y2="15" />
      <line x1="268" y1="15" x2="282" y2="15" />
      <line x1="318" y1="15" x2="332" y2="15" />
      <line x1="368" y1="15" x2="382" y2="15" />
    </g>
  </g>
</svg>
