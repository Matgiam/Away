<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-label="Were those notes close together or far apart?">
  <rect width="760" height="240" fill="#0a0118" />
  <text x="380" y="32" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#c75ad6" text-anchor="middle">How wide is the leap?</text>
  <!-- CLOSE: small gap -->
  <g transform="translate(80 90)">
    <circle cx="50" cy="65" r="16" fill="#c75ad6" stroke="#fff" stroke-width="2" />
    <circle cx="100" cy="55" r="16" fill="#c75ad6" stroke="#fff" stroke-width="2" />
    <path d="M 60 60 L 92 53" stroke="#c75ad6" stroke-width="3" />
    <text x="80" y="120" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="800" fill="#c75ad6" text-anchor="middle">Close</text>
    <text x="80" y="145" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-style="italic" fill="#c75ad6" text-anchor="middle">a step or two</text>
  </g>
  <!-- FAR: big gap -->
  <g transform="translate(360 60)">
    <circle cx="40"  cy="100" r="16" fill="#9bf8fd" stroke="#fff" stroke-width="2" />
    <circle cx="280" cy="10"  r="16" fill="#9bf8fd" stroke="#fff" stroke-width="2" />
    <path d="M 55 92 L 265 18" stroke="#9bf8fd" stroke-width="3" />
    <text x="160" y="160" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="800" fill="#9bf8fd" text-anchor="middle">Far</text>
    <text x="160" y="185" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-style="italic" fill="#9bf8fd" text-anchor="middle">a big leap (5th, octave, more)</text>
  </g>
</svg>
