<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-label="Half step versus whole step on the piano">
  <rect width="760" height="220" fill="#0a0118" />
  <g transform="translate(20 30)">
    <rect x="0"   y="0" width="90" height="170" fill="#f5efe2" stroke="#1a1108" stroke-width="2" />
    <rect x="90"  y="0" width="90" height="170" fill="#f5efe2" stroke="#1a1108" stroke-width="2" />
    <rect x="180" y="0" width="90" height="170" fill="#f5efe2" stroke="#1a1108" stroke-width="2" />
    <rect x="270" y="0" width="90" height="170" fill="#f5efe2" stroke="#1a1108" stroke-width="2" />
    <rect x="360" y="0" width="90" height="170" fill="#f5efe2" stroke="#1a1108" stroke-width="2" />
    <rect x="450" y="0" width="90" height="170" fill="#f5efe2" stroke="#1a1108" stroke-width="2" />
    <rect x="540" y="0" width="90" height="170" fill="#f5efe2" stroke="#1a1108" stroke-width="2" />
    <rect x="630" y="0" width="90" height="170" fill="#f5efe2" stroke="#1a1108" stroke-width="2" />
    <g fill="#161616">
      <rect x="60"  y="0" width="60" height="105" />
      <rect x="150" y="0" width="60" height="105" />
      <rect x="330" y="0" width="60" height="105" />
      <rect x="420" y="0" width="60" height="105" />
      <rect x="510" y="0" width="60" height="105" />
    </g>
    <!-- Half step C → C♯ -->
    <g stroke="#c75ad6" stroke-width="3" fill="none">
      <path d="M 45 -8 L 45 -18 L 90 -18 L 90 -8" />
    </g>
    <text x="67" y="-22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#c75ad6" text-anchor="middle">Half step</text>

    <!-- Whole step C → D -->
    <g stroke="#5571a8" stroke-width="3" fill="none">
      <path d="M 45 -38 L 45 -48 L 135 -48 L 135 -38" />
    </g>
    <text x="90" y="-52" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#9aaadb" text-anchor="middle">Whole step</text>

    <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1a1108" text-anchor="middle">
      <text x="45"  y="150">C</text>
      <text x="135" y="150">D</text>
    </g>
    <text x="90" y="60" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">C♯</text>
  </g>
</svg>
