<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" role="img" aria-label="C major chord — press C, E, G together">
  <rect width="700" height="220" fill="#0a0118" />
  <g transform="translate(20 30)">
    <!-- 7 white keys C..B -->
    <rect x="0"   y="0" width="90" height="170" fill="#c75ad6" stroke="#1a1108" stroke-width="2" />
    <rect x="90"  y="0" width="90" height="170" fill="#f5efe2" stroke="#1a1108" stroke-width="2" />
    <rect x="180" y="0" width="90" height="170" fill="#c75ad6" stroke="#1a1108" stroke-width="2" />
    <rect x="270" y="0" width="90" height="170" fill="#f5efe2" stroke="#1a1108" stroke-width="2" />
    <rect x="360" y="0" width="90" height="170" fill="#c75ad6" stroke="#1a1108" stroke-width="2" />
    <rect x="450" y="0" width="90" height="170" fill="#f5efe2" stroke="#1a1108" stroke-width="2" />
    <rect x="540" y="0" width="90" height="170" fill="#f5efe2" stroke="#1a1108" stroke-width="2" />
    <g fill="#161616">
      <rect x="60"  y="0" width="60" height="105" />
      <rect x="150" y="0" width="60" height="105" />
      <rect x="330" y="0" width="60" height="105" />
      <rect x="420" y="0" width="60" height="105" />
      <rect x="510" y="0" width="60" height="105" />
    </g>
    <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">
      <text x="45"  y="150">C</text>
      <text x="225" y="150">E</text>
      <text x="405" y="150">G</text>
    </g>
    <text x="315" y="-8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#c75ad6" text-anchor="middle">C major — C · E · G</text>
  </g>
</svg>
