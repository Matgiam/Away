<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" role="img" aria-label="Mary had a little lamb phrase 2 — uses C D E G. Press order: D D D E G G">
  <rect width="780" height="260" fill="#0a0118" />
  <text x="390" y="28" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#c75ad6" text-anchor="middle">Phrase 2 — now you add G (skip F)</text>

  <g transform="translate(140 50)">
    <rect x="0"   y="0" width="100" height="140" fill="#c75ad6" stroke="#1a1108" stroke-width="2" />
    <rect x="100" y="0" width="100" height="140" fill="#c75ad6" stroke="#1a1108" stroke-width="2" />
    <rect x="200" y="0" width="100" height="140" fill="#c75ad6" stroke="#1a1108" stroke-width="2" />
    <rect x="300" y="0" width="100" height="140" fill="#f5efe2" stroke="#1a1108" stroke-width="2" />
    <rect x="400" y="0" width="100" height="140" fill="#c75ad6" stroke="#1a1108" stroke-width="2" />
    <g fill="#161616">
      <rect x="70"  y="0" width="60" height="85" />
      <rect x="170" y="0" width="60" height="85" />
      <rect x="370" y="0" width="60" height="85" />
    </g>
    <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800" text-anchor="middle">
      <text x="50"  y="120" fill="#fff">C</text>
      <text x="150" y="120" fill="#fff">D</text>
      <text x="250" y="120" fill="#fff">E</text>
      <text x="350" y="120" fill="#1a1108">F</text>
      <text x="450" y="120" fill="#fff">G</text>
    </g>
    <!-- Cross out F only -->
    <g stroke="#ff8d96" stroke-width="3.5" stroke-linecap="round" opacity="0.85">
      <line x1="318" y1="20" x2="382" y2="60" />
      <line x1="382" y1="20" x2="318" y2="60" />
    </g>
  </g>

  <g transform="translate(180 210)" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="800" text-anchor="middle">
    <text x="-20" y="20" font-size="12" font-style="italic" font-weight="400" fill="#9aaadb" text-anchor="start">Press in order:</text>
    <g>
      <circle cx="100" cy="15" r="16" fill="#c75ad6" />
      <text x="100" y="21" font-size="14" fill="#fff">D</text>
      <circle cx="160" cy="15" r="16" fill="#c75ad6" />
      <text x="160" y="21" font-size="14" fill="#fff">D</text>
      <circle cx="220" cy="15" r="16" fill="#c75ad6" />
      <text x="220" y="21" font-size="14" fill="#fff">D</text>
      <circle cx="280" cy="15" r="16" fill="#c75ad6" />
      <text x="280" y="21" font-size="14" fill="#fff">E</text>
      <circle cx="340" cy="15" r="16" fill="#c75ad6" />
      <text x="340" y="21" font-size="14" fill="#fff">G</text>
      <circle cx="400" cy="15" r="16" fill="#c75ad6" />
      <text x="400" y="21" font-size="14" fill="#fff">G</text>
    </g>
    <g stroke="#c75ad6" stroke-width="2" fill="none" opacity="0.5">
      <line x1="118" y1="15" x2="142" y2="15" />
      <line x1="178" y1="15" x2="202" y2="15" />
      <line x1="238" y1="15" x2="262" y2="15" />
      <line x1="298" y1="15" x2="322" y2="15" />
      <line x1="358" y1="15" x2="382" y2="15" />
    </g>
  </g>
</svg>
